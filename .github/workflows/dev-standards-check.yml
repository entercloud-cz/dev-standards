# Reusable drift check — call it from a consumer repo:
#
#   jobs:
#     standards:
#       uses: entercloud-cz/dev-standards/.github/workflows/dev-standards-check.yml@main
#
# It fails when a vendored file no longer matches the version the project pinned, which is
# the failure that would otherwise be invisible: a shared skill edited in one consumer,
# overwritten by the next update, never reaching the other repos.
#
# When a newer dev-standards release exists than the pin, the run stays green but carries
# a yellow annotation and a job-summary note — updating is deliberate, not knowing is not.
name: dev-standards drift check

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '20'

jobs:
  check:
    # The display name every consumer sees in its PR checks — it must say where the
    # gate comes from, whatever the consumer named its caller workflow.
    name: dev-standards check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Resolve the pinned version
        id: pin
        run: |
          v=$(jq -r '.version // empty' .dev-standards.json 2>/dev/null)
          if [ -z "$v" ]; then
            echo "::error::.dev-standards.json is missing or has no version — run: npx github:entercloud-cz/dev-standards install"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Vendored standards match the pinned version
        # Pinned fetch: CI executes exactly the CLI release this project vendored
        # against, never upstream HEAD — deliberate updates stay deliberate in CI too.
        run: npx --yes "github:entercloud-cz/dev-standards#v${{ steps.pin.outputs.version }}" check
      - name: Note a newer release (the build stays green)
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: v${{ steps.pin.outputs.version }}
        run: |
          latest=$(gh api repos/entercloud-cz/dev-standards/tags --jq '.[].name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          newer=$(printf '%s\n%s\n' "$latest" "$PINNED" | sort -V | tail -1)
          if [ -n "$latest" ] && [ "$latest" != "$PINNED" ] && [ "$newer" = "$latest" ]; then
            msg="dev-standards $latest is available — this project pins $PINNED. Run: npx github:entercloud-cz/dev-standards update"
            echo "::warning title=dev-standards update available::$msg"
            echo "> ⚠️ $msg" >> "$GITHUB_STEP_SUMMARY"
          fi
