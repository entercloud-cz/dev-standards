# Fails when a vendored dev-standards file was edited locally — that edit would be
# overwritten by the next update and never reach the other repos. A yellow annotation
# (build stays green) means a newer dev-standards release exists.
name: dev-standards

on:
  push:
    branches: [main]
  pull_request:
  # A gate that only a webhook can trigger is unreachable exactly when webhooks are
  # throttled — during the 2026-08-06 Actions incident push and pull_request events
  # started no runs for hours, while changes were still being merged.
  workflow_dispatch:

jobs:
  standards:
    uses: entercloud-cz/dev-standards/.github/workflows/dev-standards-check.yml@main
